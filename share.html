<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小家</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: #FFEDE4;
        }
        body {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .card-img {
            width: 100%;
            height: auto;
            display: block;
        }
        #nl-badge-frame, .netlify-badge { display: none !important; }
    </style>
</head>
<body>
    <img class="card-img" id="cardImg" src="" alt="">
    <script>
        const params = new URLSearchParams(window.location.search);
        const text = params.get('text') || '';
        const tag = params.get('tag') || '';
        document.getElementById('cardImg').src = '/.netlify/functions/card?text=' + encodeURIComponent(text) + '&tag=' + encodeURIComponent(tag);
    </script>
</body>
</html>
