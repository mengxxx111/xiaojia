<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小家 · 好好说话</title>
    <script src="html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #FFF6F0 0%, #FFEDE4 50%, #FFE8DE 100%);
            color: #4A3728;
            min-height: 100vh;
        }
        .container {
            max-width: 440px;
            margin: 0 auto;
            padding: 24px 18px 40px;
        }

        /* 顶部 */
        .header {
            text-align: center;
            padding: 20px 0 28px;
        }
        .header .logo {
            font-size: 30px;
            font-weight: 600;
            color: #C9705A;
            letter-spacing: 8px;
            text-indent: 8px;
        }
        .header .slogan {
            font-size: 13px;
            color: #C4A89A;
            margin-top: 8px;
            letter-spacing: 2px;
        }
        .header .divider {
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #E8B4A0, transparent);
            margin: 14px auto 0;
            border-radius: 2px;
        }

        /* 性别切换 */
        .gender-row {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-bottom: 18px;
            background: rgba(255,255,255,0.6);
            border-radius: 30px;
            padding: 4px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 2px 10px rgba(201,112,90,0.06);
        }
        .gender-btn {
            padding: 8px 28px;
            border: none;
            background: transparent;
            border-radius: 26px;
            font-size: 14px;
            color: #B89E8E;
            cursor: pointer;
            transition: all 0.25s;
        }
        .gender-btn.active {
            background: linear-gradient(135deg, #E8927C, #D4755F);
            color: #fff;
            box-shadow: 0 3px 10px rgba(212,117,95,0.3);
        }

        /* 输入框 */
        .input-card {
            background: #fff;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(201,112,90,0.07);
        }
        .input-card textarea {
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            font-size: 15px;
            line-height: 1.8;
            min-height: 90px;
            color: #4A3728;
            background: transparent;
        }
        .input-card textarea::placeholder {
            color: #D4C0B5;
        }

        /* 区块标题 */
        .section-label {
            font-size: 13px;
            color: #B89E8E;
            margin: 18px 0 10px 4px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* 场景按钮 */
        .scene-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .scene-btn {
            padding: 14px 0;
            border: 2px solid transparent;
            border-radius: 14px;
            background: #fff;
            color: #8A7060;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(201,112,90,0.05);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .scene-btn:active {
            transform: scale(0.97);
        }
        .scene-btn.active {
            background: linear-gradient(135deg, #FFE0D6, #FFD4C4);
            border-color: #E8927C;
            color: #C9705A;
            font-weight: 600;
        }

        /* 档位选择 */
        .ladder {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .ladder-btn {
            flex: 1;
            min-width: 58px;
            padding: 9px 4px;
            border: none;
            border-radius: 10px;
            background: #fff;
            color: #B89E8E;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(201,112,90,0.05);
            transition: all 0.2s;
            text-align: center;
        }
        .ladder-btn:active {
            transform: scale(0.95);
        }
        .ladder-btn.active {
            background: linear-gradient(135deg, #E8927C, #D4755F);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 3px 8px rgba(212,117,95,0.25);
        }

        /* 生成按钮 */
        .generate-btn {
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #E8927C, #C9705A);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(201,112,90,0.3);
            margin-top: 24px;
            transition: all 0.2s;
            letter-spacing: 2px;
        }
        .generate-btn:active {
            transform: scale(0.98);
        }
        .generate-btn:disabled {
            opacity: 0.6;
        }

        /* 加载 */
        .loading-card {
            background: #fff;
            border-radius: 18px;
            padding: 30px;
            margin-top: 20px;
            text-align: center;
            color: #C4A89A;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(201,112,90,0.07);
            display: none;
        }
        .loading-card .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #E8927C;
            margin: 0 3px;
            animation: pulse 1.2s infinite ease-in-out;
        }
        .loading-card .pulse:nth-child(2) { animation-delay: 0.2s; }
        .loading-card .pulse:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.2); }
        }

        /* 结果卡片 */
        .result-card {
            background: linear-gradient(180deg, #FFF9F5, #FFF3EC);
            border-radius: 20px;
            padding: 28px 22px;
            margin-top: 20px;
            box-shadow: 0 6px 28px rgba(201,112,90,0.12);
            display: none;
            position: relative;
            overflow: hidden;
            border: 1px solid #FFE0D6;
        }
        .result-card::before {
            content: '“';
            position: absolute;
            top: 4px;
            left: 16px;
            font-size: 72px;
            color: #FFC9B5;
            font-family: Georgia, "Times New Roman", serif;
            line-height: 1;
        }
        .result-card::after {
            content: '”';
            position: absolute;
            bottom: -20px;
            right: 16px;
            font-size: 72px;
            color: #FFC9B5;
            font-family: Georgia, "Times New Roman", serif;
            line-height: 1;
        }
        .result-tag {
            display: inline-block;
            font-size: 11px;
            color: #fff;
            background: linear-gradient(135deg, #E8927C, #D4755F);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
        .result-text {
            font-size: 16px;
            line-height: 2;
            color: #5C4033;
            margin-bottom: 22px;
            position: relative;
            z-index: 1;
        }
        .result-actions {
            display: flex;
            gap: 8px;
            position: relative;
            z-index: 1;
        }
        .action-btn {
            flex: 1;
            padding: 11px 0;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn:active {
            transform: scale(0.96);
        }
        .action-btn.primary {
            background: linear-gradient(135deg, #E8927C, #D4755F);
            color: #fff;
            font-weight: 500;
        }
        .action-btn.secondary {
            background: #fff;
            color: #C9705A;
            border: 1px solid #FFD4C4;
        }
        .action-btn.ghost {
            background: #fff;
            color: #B89E8E;
            border: 1px solid #F0E0D8;
        }

        /* 存图弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-overlay img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 12px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
        }
        .modal-tip {
            color: #fff;
            font-size: 14px;
            margin-top: 16px;
            text-align: center;
            line-height: 1.8;
        }
        .modal-close {
            margin-top: 16px;
            padding: 10px 30px;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 20px;
            background: transparent;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        /* 底部 */
        .footer {
            text-align: center;
            margin-top: 36px;
            font-size: 12px;
            color: #D4BFB5;
            letter-spacing: 3px;
        }

        /* 隐藏Netlify水印 */
        #nl-badge-frame,
        .netlify-badge,
        a[href*="netlify.com"][target="_blank"],
        iframe[src*="netlify"] {
            display: none !important;
        }

        /* toast提示 */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">小家</div>
            <div class="slogan">两人即成小家</div>
            <div class="divider"></div>
        </div>

        <div class="gender-row">
            <button class="gender-btn active" data-gender="female">我是 她</button>
            <button class="gender-btn" data-gender="male">我是 他</button>
        </div>

        <div class="input-card">
            <textarea id="input" placeholder="把你想说的话写在这里，气话、委屈、想念都可以…"></textarea>
        </div>

        <div class="section-label">选择场景</div>
        <div class="scene-grid">
            <button class="scene-btn active" data-scene="peace">💢 吵架和解</button>
            <button class="scene-btn" data-scene="soft">🌸 委婉表达</button>
            <button class="scene-btn" data-scene="warm">☀️ 日常暖心</button>
            <button class="scene-btn" data-scene="sorry">🤍 郑重道歉</button>
        </div>

        <div class="section-label">语气</div>
        <div class="ladder" id="toneLadder">
            <button class="ladder-btn" data-level="1">克制</button>
            <button class="ladder-btn" data-level="2">温柔</button>
            <button class="ladder-btn active" data-level="3">体贴</button>
            <button class="ladder-btn" data-level="4">俏皮</button>
            <button class="ladder-btn" data-level="5">撒娇</button>
        </div>

        <div class="section-label">长短</div>
        <div class="ladder" id="lengthLadder">
            <button class="ladder-btn" data-level="1">一句话</button>
            <button class="ladder-btn active" data-level="2">两三句</button>
            <button class="ladder-btn" data-level="3">一段话</button>
            <button class="ladder-btn" data-level="4">小段落</button>
            <button class="ladder-btn" data-level="5">情书</button>
        </div>

        <button class="generate-btn" id="generate">✨ 生成话术</button>

        <div class="loading-card" id="loadingCard">
            <span class="pulse"></span><span class="pulse"></span><span class="pulse"></span>
            <div style="margin-top:10px">正在替你好好说话…</div>
        </div>

        <div class="result-card" id="resultCard">
            <span class="result-tag" id="resultTag">吵架和解</span>
            <div class="result-text" id="resultText"></div>
            <div class="result-actions">
                <button class="action-btn secondary" id="regenBtn">换一条</button>
                <button class="action-btn primary" id="copyBtn">复制</button>
                <button class="action-btn ghost" id="shareBtn">存图</button>
            </div>
        </div>

        <div class="footer">好好说话 · 慢慢过日子</div>
    </div>

    <!-- 存图弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <img id="modalImg" src="" alt="话术卡片">
        <div class="modal-tip">直接截屏这张图就能保存<br>iPhone：电源键+音量上键<br>安卓：电源键+音量下键</div>
        <button class="modal-close" id="modalClose">关闭</button>
    </div>

    <!-- toast -->
    <div class="toast" id="toast"></div>

    <script>
        const sceneBtns = document.querySelectorAll('.scene-btn');
        const genderBtns = document.querySelectorAll('.gender-btn');
        const toneBtns = document.querySelectorAll('#toneLadder .ladder-btn');
        const lengthBtns = document.querySelectorAll('#lengthLadder .ladder-btn');
        const generateBtn = document.getElementById('generate');
        const input = document.getElementById('input');
        const resultCard = document.getElementById('resultCard');
        const resultText = document.getElementById('resultText');
        const resultTag = document.getElementById('resultTag');
        const loadingCard = document.getElementById('loadingCard');
        const copyBtn = document.getElementById('copyBtn');
        const regenBtn = document.getElementById('regenBtn');
        const shareBtn = document.getElementById('shareBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalImg = document.getElementById('modalImg');
        const modalClose = document.getElementById('modalClose');
        const toast = document.getElementById('toast');

        let currentScene = 'peace';
        let currentGender = 'female';
        let currentTone = 3;
        let currentLength = 2;

        const sceneNames = { peace: '吵架和解', soft: '委婉表达', warm: '日常暖心', sorry: '郑重道歉' };
        const toneLabels = {
            male: ['克制', '沉稳', '温柔', '幽默', '俏皮'],
            female: ['克制', '温柔', '体贴', '俏皮', '撒娇']
        };

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // 场景切换
        sceneBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                sceneBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentScene = btn.dataset.scene;
            });
        });

        // 性别切换
        genderBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                genderBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentGender = btn.dataset.gender;
                const labels = toneLabels[currentGender];
                toneBtns.forEach((b, i) => { b.textContent = labels[i]; });
            });
        });

        // 语气档位
        toneBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                toneBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTone = parseInt(btn.dataset.level);
            });
        });

        // 长短档位
        lengthBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                lengthBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentLength = parseInt(btn.dataset.level);
            });
        });

        // 调用生成
        async function generate() {
            const content = input.value.trim();
            if (!content) {
                input.focus();
                return;
            }

            generateBtn.disabled = true;
            loadingCard.style.display = 'block';
            resultCard.style.display = 'none';

            try {
                const res = await fetch('/.netlify/functions/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        scene: currentScene,
                        content: content,
                        gender: currentGender,
                        tone: currentTone,
                        length: currentLength
                    })
                });

                const data = await res.json();
                if (data.result) {
                    resultText.textContent = data.result;
                    resultTag.textContent = sceneNames[currentScene];
                    resultCard.style.display = 'block';
                } else {
                    showToast('生成失败，请稍后再试');
                }
            } catch (e) {
                showToast('网络出错，请检查后重试');
            } finally {
                generateBtn.disabled = false;
                loadingCard.style.display = 'none';
            }
        }

        generateBtn.addEventListener('click', generate);
        regenBtn.addEventListener('click', generate);

        // 复制（兼容手机/微信浏览器）
        copyBtn.addEventListener('click', () => {
            const text = resultText.textContent;

            // 方案1：现代Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('已复制，去粘贴给TA吧');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        });

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            ta.style.top = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try {
                document.execCommand('copy');
                showToast('已复制，去粘贴给TA吧');
            } catch (e) {
                showToast('复制失败，请长按文字手动复制');
            }
            document.body.removeChild(ta);
        }

        // 存图：不跳转，直接在当前页面全屏显示图片（避免新页面的长按限制）
        shareBtn.addEventListener('click', () => {
            shareBtn.textContent = '生成中…';
            shareBtn.disabled = true;

            try {
                const text = encodeURIComponent(resultText.textContent);
                const tag = encodeURIComponent(sceneNames[currentScene]);
                const imgUrl = `/.netlify/functions/card?text=${text}&tag=${tag}`;

                // 创建全屏覆盖层
                let overlay = document.getElementById('fullscreenImgOverlay');
                if (!overlay) {
                    overlay = document.createElement('div');
                    overlay.id = 'fullscreenImgOverlay';
                    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#FFEDE4;z-index:99999;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;';
                    overlay.innerHTML = `
                        <div style="position:sticky;top:10px;right:10px;text-align:right;padding:10px;z-index:2;">
                            <span id="closeFullscreenImg" style="display:inline-block;width:36px;height:36px;line-height:36px;text-align:center;background:rgba(0,0,0,0.3);color:#fff;border-radius:50%;font-size:20px;">×</span>
                        </div>
                        <img id="fullscreenImg" src="" style="width:100%;display:block;margin-top:-56px;" />
                    `;
                    document.body.appendChild(overlay);
                    document.getElementById('closeFullscreenImg').addEventListener('click', () => {
                        overlay.style.display = 'none';
                    });
                }

                const fsImg = document.getElementById('fullscreenImg');
                fsImg.onload = () => {
                    overlay.style.display = 'block';
                    document.body.style.overflow = 'hidden';
                    shareBtn.textContent = '存图';
                    shareBtn.disabled = false;
                };
                fsImg.src = imgUrl;

                // 超时兜底
                setTimeout(() => {
                    if (overlay.style.display !== 'block') {
                        overlay.style.display = 'block';
                        document.body.style.overflow = 'hidden';
                        shareBtn.textContent = '存图';
                        shareBtn.disabled = false;
                    }
                }, 5000);

            } catch (err) {
                console.error(err);
                showToast('生成失败，请稍后再试');
                shareBtn.textContent = '存图';
                shareBtn.disabled = false;
            }
        });

        // Canvas画分享卡片
        function drawShareCard(text, tag) {
            const W = 750;
            const padding = 60;
            const tagH = 50;
            const lineHeight = 56;
            const fontSize = 32;
            const footerH = 60;

            // 先算文字高度
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.font = `${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
            const maxTextWidth = W - padding * 2;
            const lines = wrapText(ctx, text, maxTextWidth);
            const textH = lines.length * lineHeight;

            // 定画布高度
            const H = padding * 2 + tagH + 30 + textH + 40 + footerH;
            canvas.width = W;
            canvas.height = H;

            // 背景渐变
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#FFF9F5');
            grad.addColorStop(1, '#FFEDE4');
            ctx.fillStyle = grad;
            roundRect(ctx, 0, 0, W, H, 24);
            ctx.fill();

            // 装饰引号
            ctx.fillStyle = '#FFC9B5';
            ctx.font = 'bold 100px Georgia, serif';
            ctx.fillText('"', padding - 10, padding + 50);

            // 标签胶囊
            ctx.font = '24px "PingFang SC", sans-serif';
            const tagW = ctx.measureText(tag).width + 40;
            const tagX = padding;
            const tagY = padding + 10;
            const tagGrad = ctx.createLinearGradient(tagX, tagY, tagX + tagW, tagY + tagH);
            tagGrad.addColorStop(0, '#E8927C');
            tagGrad.addColorStop(1, '#D4755F');
            ctx.fillStyle = tagGrad;
            roundRect(ctx, tagX, tagY, tagW, tagH, 25);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.textBaseline = 'middle';
            ctx.fillText(tag, tagX + 20, tagY + tagH / 2 + 1);

            // 正文
            ctx.font = `${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
            ctx.fillStyle = '#5C4033';
            ctx.textBaseline = 'top';
            let y = tagY + tagH + 30;
            lines.forEach(line => {
                ctx.fillText(line, padding, y);
                y += lineHeight;
            });

            // 底部品牌
            ctx.font = '20px "PingFang SC", sans-serif';
            ctx.fillStyle = '#D4A89A';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('小 家 · 两 人 即 成 小 家', W / 2, H - 30);
            ctx.textAlign = 'left';

            return canvas;
        }

        // 中文自动换行
        function wrapText(ctx, text, maxWidth) {
            const lines = [];
            let line = '';
            for (let i = 0; i < text.length; i++) {
                const test = line + text[i];
                if (ctx.measureText(test).width > maxWidth) {
                    lines.push(line);
                    line = text[i];
                } else {
                    line = test;
                }
            }
            if (line) lines.push(line);
            return lines;
        }

        // 圆角矩形路径
        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        modalClose.addEventListener('click', () => {
            modalOverlay.classList.remove('show');
        });
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('show');
            }
        });
    </script>
</body>
</html>
