<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小家 · 两人即成小家</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 8 L92 38 V92 H8 V38 Z' fill='none' stroke='%23e8b96a' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='50' cy='66' r='12' fill='%23e8b96a'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://miaoda.feishu.cn">
    <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
    <style>
        :root {
            --gold: #e8b96a;
            --gold-bright: #f0c98c;
            --gold-dim: rgba(232,185,106,0.38);
            --amber: #e39a5a;
            --amber-dim: rgba(227,154,90,0.32);
            --cocoa-1: #2a211b;
            --cocoa-2: #211a15;
            --cocoa-3: #18120e;
            --ink: #120d0a;
            --cream: #f5ecdf;
            --cream-dim: #d8c9b4;
            --cream-faint: #a3937f;
            --line: rgba(232,185,106,0.2);
            --line-strong: rgba(232,185,106,0.52);
            --card-bg: rgba(255,240,220,0.035);
            --shadow: 0 22px 60px rgba(0,0,0,0.5);
            --ease-out: cubic-bezier(0.16,1,0.3,1);
            --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        ::selection { background:rgba(232,185,106,0.32); color:#fff; }
        html { scroll-behavior:smooth; }
        html,body { height:100%; }
        body {
            font-family: "Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
            background: var(--ink);
            color: var(--cream);
            min-height:100vh;
            position:relative; overflow-x:hidden;
            letter-spacing:0.02em;
            font-weight:300;
        }

        /* ===== 自定义光标（桌面） ===== */
        .cursor-dot, .cursor-ring {
            position:fixed; top:-100px; left:-100px; pointer-events:none;
            border-radius:50%; z-index:9999; display:none;
        }
        body.custom-cursor .cursor-dot { display:block; }
        body.custom-cursor .cursor-ring { display:block; }
        .cursor-dot { width:7px; height:7px; background:var(--gold); transform:translate(-50%,-50%); box-shadow:0 0 14px rgba(232,185,106,0.6); }
        .cursor-ring { width:34px; height:34px; border:1px solid rgba(232,185,106,0.5); transform:translate(-50%,-50%); transition:width 0.3s var(--ease-out),height 0.3s var(--ease-out),border-color 0.3s,background 0.3s,opacity 0.3s; }
        body.custom-cursor .cursor-ring.grow { width:56px; height:56px; border-color:var(--gold); background:rgba(232,185,106,0.08); }
        body.custom-cursor .cursor-ring.hide { opacity:0; }

        /* ===== 暖灯·家居画布（深可可暖调，烛光金） ===== */
        .home { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
        .home::before {
            content:''; position:absolute; inset:0;
            background:
                radial-gradient(ellipse 90% 46% at 50% -8%, #3a2c20 0%, transparent 60%),
                radial-gradient(ellipse 62% 36% at 16% 108%, #2e241c 0%, transparent 62%),
                radial-gradient(ellipse 55% 34% at 88% 102%, #33241b 0%, transparent 58%),
                linear-gradient(180deg, #241b15 0%, #1d1611 55%, #14100c 100%);
        }
        .home::after {
            content:''; position:absolute; inset:0;
            background:
                radial-gradient(circle at 26% 20%, rgba(232,185,106,0.10) 0%, transparent 32%),
                radial-gradient(circle at 74% 66%, rgba(227,154,90,0.07) 0%, transparent 30%),
                radial-gradient(circle at 50% 92%, rgba(232,185,106,0.06) 0%, transparent 30%);
        }
        .ember { position:absolute; border-radius:50%; background:var(--gold-bright); opacity:0; filter:blur(1px); animation:emberFloat 4.6s ease-in-out infinite; }
        @keyframes emberFloat { 0%,100%{ opacity:0; transform:translateY(14px);} 45%{ opacity:0.5;} 70%{ opacity:0.15;} }

        .stage {
            position:relative; z-index:1;
            width:100%; max-width:460px; min-height:100vh;
            display:flex; margin:0 auto;
            padding:30px 22px;
        }
        .container { width:100%; margin:auto; }
        .page { display:none; }
        .page.active { display:block; }
        .page-head { text-align:center; margin-bottom:34px; }
        .page-head .step {
            display:inline-flex; align-items:center; gap:12px;
            font-size:11px; color:var(--gold); letter-spacing:0.44em; margin-bottom:16px;
        }
        .page-head .step::before, .page-head .step::after { content:''; width:22px; height:1px; background:linear-gradient(to right, transparent, var(--gold-dim)); }
        .page-head .step::after { background:linear-gradient(to left, transparent, var(--gold-dim)); }
        .page-head h2 {
            font-family:"Noto Serif SC",serif;
            font-size:27px; font-weight:400; letter-spacing:0.12em;
            color:var(--cream); margin-bottom:11px;
        }
        .page-head p { font-size:13.5px; color:var(--cream-faint); letter-spacing:0.08em; }

        /* ===== 胶囊按钮（圆润·磁吸） ===== */
        .btn {
            width:100%; padding:17px 22px;
            border:1px solid var(--line-strong);
            background:transparent;
            color:var(--gold-bright); font-size:15px; letter-spacing:0.3em; cursor:pointer;
            border-radius:40px; transition:background 0.4s, color 0.4s, border-color 0.4s, box-shadow 0.4s;
            font-weight:400; font-family:inherit; text-indent:0.3em;
            position:relative; display:inline-block;
        }
        .btn:hover {
            background:linear-gradient(120deg, #e8b96a, #f0c98c);
            color:#211a15; border-color:#e8b96a;
            box-shadow:0 14px 40px rgba(232,185,106,0.28);
        }
        .btn.secondary { color:var(--cream-dim); border-color:rgba(255,255,255,0.14); border-radius:40px; }
        .btn.secondary:hover { background:rgba(255,255,255,0.06); color:var(--cream); border-color:rgba(255,255,255,0.22); box-shadow:none; }

        /* ===== 圆形主按钮 ===== */
        .orb-wrap { display:flex; justify-content:center; margin:36px 0 8px; }
        .orb-btn {
            position:relative; width:138px; height:138px; border-radius:50%;
            border:1px solid var(--line-strong); background:rgba(255,240,220,0.03);
            color:var(--gold-bright); cursor:pointer; font-family:inherit;
            font-size:15px; letter-spacing:0.26em; font-weight:400;
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
            transition:box-shadow 0.5s, border-color 0.5s, background 0.5s;
            animation:orbBreath 3.6s ease-in-out infinite;
        }
        .orb-btn::before {
            content:''; position:absolute; inset:-7px; border-radius:50%;
            border:1px dashed rgba(232,185,106,0.35);
            animation:orbSpin 14s linear infinite;
        }
        .orb-btn::after {
            content:''; position:absolute; inset:-16px; border-radius:50%;
            border:1px solid rgba(232,185,106,0.14);
        }
        .orb-btn .orb-sub { font-size:10px; color:var(--cream-faint); letter-spacing:0.2em; }
        .orb-btn:hover { border-color:var(--gold); background:rgba(232,185,106,0.08); box-shadow:0 0 60px rgba(232,185,106,0.3); }
        @keyframes orbBreath { 0%,100%{ box-shadow:0 0 24px rgba(232,185,106,0.14);} 50%{ box-shadow:0 0 54px rgba(232,185,106,0.32);} }
        @keyframes orbSpin { to { transform:rotate(360deg); } }

        .field-label {
            font-size:12px; color:var(--cream-faint);
            letter-spacing:0.34em; margin-bottom:15px;
            display:flex; align-items:center; gap:12px;
        }
        .field-label::before { content:''; width:20px; height:1px; background:linear-gradient(to right, var(--gold-dim), transparent); }

        /* ===== 启动页 ===== */
        .start-page { text-align:center; padding:30px 6px 26px; }
        .emblem { width:82px; height:82px; margin:0 auto 30px; }
        .emblem svg { width:100%; height:100%; }
        .emblem .roof { fill:none; stroke:var(--gold); stroke-width:2.4; stroke-linejoin:round; }
        .emblem .roof2 { fill:none; stroke:var(--gold-dim); stroke-width:1.2; opacity:0.75; }
        .emblem .heart { fill:none; stroke:var(--gold); stroke-width:2; }
        .emblem .flame { fill:var(--gold); }
        .emblem-wrap { opacity:0; transform:scale(0.9); animation:emblemIn 1s var(--ease-out) forwards; }
        @keyframes emblemIn { to { opacity:1; transform:scale(1); } }

        .logo-line {
            font-family:"Noto Serif SC",serif;
            font-size:64px; font-weight:400; letter-spacing:0.34em;
            color:var(--cream); margin-bottom:16px;
            text-shadow:0 0 46px rgba(232,185,106,0.18);
        }
        .logo-line .char-mask { display:inline-block; overflow:hidden; vertical-align:bottom; }
        .logo-line .char { display:inline-block; transform:translateY(114%); }
        .logo-line .char.up { animation:charUp 0.85s var(--ease-out) forwards; }
        @keyframes charUp { to { transform:translateY(0); } }
        .logo-line .gold { color:var(--gold); }

        .slogan {
            font-size:14.5px; font-weight:300; color:var(--cream-dim);
            letter-spacing:0.5em; text-indent:0.5em; margin-bottom:32px;
            opacity:0; animation:fadeUp 0.9s var(--ease-out) 0.5s forwards;
        }
        @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

        .start-quote {
            font-family:"Noto Serif SC",serif;
            font-size:15.5px; color:var(--cream-dim); line-height:2.1;
            letter-spacing:0.12em; margin-bottom:8px;
            opacity:0; animation:fadeUp 0.9s var(--ease-out) 0.8s forwards;
        }
        .start-quote em { font-style:normal; color:var(--gold-bright); }

        .start-trio {
            display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;
            margin:30px 0 6px;
            opacity:0; animation:fadeUp 0.9s var(--ease-out) 1s forwards;
        }
        .trio-item {
            border:1px solid var(--line); border-radius:14px;
            padding:13px 6px 12px; background:rgba(255,240,220,0.02);
        }
        .trio-item .t-ico { width:21px; height:21px; display:block; margin:0 auto 8px; color:var(--gold); }
        .trio-item .t-name { font-size:12px; color:var(--gold); letter-spacing:0.14em; margin-bottom:3px; }
        .trio-item .t-desc { font-size:10.5px; color:var(--cream-faint); letter-spacing:0.04em; }

        .marquee {
            margin-top:36px; overflow:hidden; white-space:nowrap;
            border-top:1px solid var(--line); border-bottom:1px solid var(--line);
            padding:12px 0; opacity:0; animation:fadeUp 0.9s var(--ease-out) 1.2s forwards;
        }
        .marquee-track { display:inline-block; white-space:nowrap; animation:marqueeMove 26s linear infinite; will-change:transform; }
        .marquee:hover .marquee-track { animation-play-state:paused; }
        @keyframes marqueeMove { from { transform:translateX(0); } to { transform:translateX(-50%); } }
        .marquee-item { display:inline-block; font-size:12px; color:var(--cream-faint); letter-spacing:0.32em; margin-right:56px; }
        .marquee-item .gold { color:var(--gold-dim); }

        /* ===== 话术页 ===== */
        .chat-page { padding:4px 2px 4px; }
        .card {
            background:var(--card-bg);
            border:1px solid var(--line); border-radius:16px;
            padding:22px 20px 24px; margin-bottom:18px;
            transition:border-color 0.4s, box-shadow 0.4s;
            position:relative;
        }
        .card:hover { border-color:rgba(232,185,106,0.35); }
        textarea {
            width:100%; border:none; outline:none; resize:none;
            background:transparent;
            font-family:inherit; font-size:15.5px; line-height:1.9;
            min-height:118px; color:var(--cream);
        }
        textarea::placeholder { color:var(--cream-faint); opacity:0.6; }
        .example-chip {
            display:inline-block; margin-top:10px;
            padding:8px 15px; border:1px dashed var(--gold-dim);
            color:var(--cream-dim); font-size:12px; border-radius:40px; cursor:pointer;
            letter-spacing:0.06em; transition:all 0.3s;
        }
        .example-chip:hover { border-color:var(--gold); color:var(--gold-bright); background:rgba(232,185,106,0.06); }

        .tag-group { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .tag {
            padding:14px 10px; text-align:center; cursor:pointer;
            border:1px solid rgba(255,255,255,0.09); border-radius:40px;
            background:transparent; color:var(--cream-dim);
            font-size:14px; letter-spacing:0.14em; transition:all 0.3s;
            font-family:inherit; font-weight:300;
        }
        .tag:hover { border-color:rgba(232,185,106,0.45); }
        .tag.selected { border-color:var(--gold); color:var(--gold-bright); background:rgba(232,185,106,0.08); }

        /* ===== 加载与结果 ===== */
        .loading-mask { display:none; text-align:center; padding:26px 0 8px; }
        .loading-mask.show { display:block; }
        .loading-mask .dots { display:inline-flex; gap:8px; }
        .loading-mask .dots span {
            width:8px; height:8px; border-radius:50%; background:var(--gold);
            animation:dotPulse 1.1s ease-in-out infinite;
        }
        .loading-mask .dots span:nth-child(2){ animation-delay:0.15s; }
        .loading-mask .dots span:nth-child(3){ animation-delay:0.3s; }
        @keyframes dotPulse { 0%,100%{ opacity:0.2; transform:scale(0.9);} 50%{ opacity:1; transform:scale(1.15);} }
        .loading-mask .load-text { font-size:12.5px; color:var(--cream-faint); letter-spacing:0.2em; margin-top:13px; }

        .result-box { display:none; margin-top:6px; animation:resultIn 0.7s var(--ease-out); }
        .result-box.show { display:block; }
        @keyframes resultIn { from { opacity:0; transform:translateY(14px);} to { opacity:1; transform:translateY(0);} }
        .result-card {
            background:rgba(232,185,106,0.05);
            border:1px solid var(--line-strong);
            border-radius:16px; padding:22px 20px 20px;
            position:relative;
        }
        .result-card::before {
            content:''; position:absolute; top:0; left:20px; right:20px; height:1px;
            background:linear-gradient(to right, transparent, var(--gold), transparent);
        }
        .result-title { font-size:11px; color:var(--gold); letter-spacing:0.4em; margin-bottom:13px; }
        .result-text {
            font-family:"Noto Serif SC",serif;
            font-size:17px; line-height:2.1; color:var(--cream);
            letter-spacing:0.06em; margin-bottom:18px;
        }
        .result-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .result-actions .btn { padding:12px 10px; font-size:13.5px; }

        .footer-text { text-align:center; font-size:10.5px; color:var(--cream-faint); margin-top:36px; letter-spacing:0.24em; opacity:0.6; }

        .toast {
            position:fixed; left:50%; bottom:56px; transform:translateX(-50%) translateY(18px);
            background:rgba(28,20,14,0.96); border:1px solid var(--line);
            color:var(--cream); font-size:13px; letter-spacing:0.1em;
            padding:13px 24px; border-radius:40px; z-index:99;
            opacity:0; pointer-events:none; transition:all 0.35s ease;
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

        /* ===== PC 宽屏（与手机端分开排版） ===== */
        @media (min-width:900px) {
            .stage { max-width:1120px; padding:52px 44px; }
            .page-head h2 { font-size:34px; letter-spacing:0.16em; }
            .page-head p { font-size:15.5px; }
            .page-head .step { font-size:12px; }

            .btn { padding:20px 26px; font-size:16.5px; }
            .field-label { font-size:13.5px; }

            .start-page { padding:32px 8px 40px; }
            .emblem { width:100px; height:100px; margin-bottom:42px; }
            .logo-line { font-size:104px; letter-spacing:0.4em; }
            .slogan { font-size:17px; margin-bottom:36px; }
            .start-quote { font-size:18px; }

            .start-trio { grid-template-columns:repeat(3,minmax(0,300px)); justify-content:center; gap:20px; margin:44px 0 10px; }
            .trio-item { padding:24px 20px 22px; border-radius:18px; }
            .trio-item .t-ico { width:29px; height:29px; margin-bottom:10px; }
            .trio-item .t-name { font-size:15px; }
            .trio-item .t-desc { font-size:13px; }

            .orb-wrap { margin:48px 0 10px; }
            .orb-btn { width:176px; height:176px; font-size:18px; }
            .orb-btn .orb-sub { font-size:11.5px; }

            .marquee { margin-top:44px; padding:15px 0; }
            .marquee-item { font-size:13.5px; margin-right:70px; }

            .chat-flex { display:flex; gap:22px; align-items:flex-start; }
            .chat-flex .chat-left { flex:0 0 46%; }
            .chat-flex .chat-right { flex:1; }
            .chat-flex .chat-right .result-box { margin-top:0; }
            .chat-flex .chat-right .result-card { min-height:270px; display:flex; flex-direction:column; justify-content:center; }
            .chat-flex .chat-right .result-actions { grid-template-columns:1fr 1fr; }
            textarea { font-size:16.5px; }
        }

        @media (max-width:380px) {
            .logo-line { font-size:52px; }
            .card { padding:18px 15px 22px; }
            .orb-btn { width:120px; height:120px; }
        }
        @media (hover:none), (pointer:coarse) {
            body.custom-cursor .cursor-dot, body.custom-cursor .cursor-ring { display:none; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation-duration:0.001s !important; animation-delay:0s !important; transition-duration:0.001s !important; }
            .logo-line .char { transform:none; }
            .marquee-track { animation:none; }
            .ember { display:none; }
        }
    </style>
</head>
<body>
    <div class="home" id="home"></div>

    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-ring" id="cursor-ring"></div>

    <div class="stage">
        <div class="container">
            <!-- ===== 启动页 ===== -->
            <div class="page start-page active" id="page-start">
                <div class="emblem-wrap">
                    <div class="emblem">
                        <svg viewBox="0 0 100 100">
                            <path class="roof" d="M50 10 L92 40 H8 Z"/>
                            <path class="roof2" d="M50 24 L78 44 H22 Z"/>
                            <circle class="flame" cx="50" cy="58" r="7"/>
                            <path class="heart" d="M50 70 c-2.4-2.6-7-3.4-9.2-.9-2.4 2.7-.6 6.2 9.2 11.4 9.8-5.2 11.6-8.7 9.2-11.4-2.2-2.5-6.8-1.7-9.2.9z"/>
                        </svg>
                    </div>
                </div>
                <h1 class="logo-line" id="logo-line"><span class="char-mask"><span class="char gold">小</span></span><span class="char-mask"><span class="char">家</span></span></h1>
                <p class="slogan">两人即成小家</p>
                <p class="start-quote">一人不为家，<em>两人即为家</em></p>

                <div class="start-trio">
                    <div class="trio-item">
                        <svg class="t-ico" viewBox="0 0 24 24"><path d="M12 3c1.5 3.6 5 4.5 5 4.5s-3.5.9-5 4.5c-1.5-3.6-5-4.5-5-4.5S10.5 6.6 12 3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
                        <div class="t-name">好好说话</div><div class="t-desc">把气话，说成暖话</div>
                    </div>
                    <div class="trio-item">
                        <svg class="t-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                        <div class="t-name">慢慢过日子</div><div class="t-desc">不急，来日方长</div>
                    </div>
                    <div class="trio-item">
                        <svg class="t-ico" viewBox="0 0 24 24"><path d="M4 5.5h16v13H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.5 3v3M15.5 3v3M4 9.5h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                        <div class="t-name">各撑一半</div><div class="t-desc">家的屋檐，两人共顶</div>
                    </div>
                </div>

                <div class="orb-wrap">
                    <button class="orb-btn" onclick="goChat()">
                        去好好<br>说话
                        <span class="orb-sub">把话说到心里</span>
                    </button>
                </div>

                <div class="marquee" id="marquee">
                    <div class="marquee-track" id="marquee-track"></div>
                </div>
            </div>

            <!-- ===== 话术页 ===== -->
            <div class="page chat-page" id="page-chat">
                <div class="page-head">
                    <div class="step">把话说到心里</div>
                    <h2>写一句，帮你润成暖话</h2>
                    <p>气话、委屈、想念，都可以好好说</p>
                </div>

                <div class="chat-flex">
                    <div class="chat-left">
                        <div class="card">
                            <div class="field-label">你想说什么</div>
                            <textarea id="input" placeholder="把你想说的话写在这里，气话、委屈、想念都可以…"></textarea>
                            <span class="example-chip" id="example-chip">想不到说什么？点我试试</span>
                        </div>

                        <div class="card">
                            <div class="field-label">此刻的心境</div>
                            <div class="tag-group" id="scene-group">
                                <div class="tag selected" data-value="peace">吵架和解</div>
                                <div class="tag" data-value="soft">委婉表达</div>
                                <div class="tag" data-value="warm">日常暖心</div>
                                <div class="tag" data-value="sorry">郑重道歉</div>
                            </div>
                        </div>

                        <button class="btn magnetic" id="generate-btn">把话说好</button>
                    </div>

                    <div class="chat-right">
                        <div class="loading-mask" id="loading-mask">
                            <div class="dots"><span></span><span></span><span></span></div>
                            <p class="load-text">正在帮你把话，说成暖话</p>
                        </div>

                        <div class="result-box" id="result-box">
                            <div class="result-card">
                                <div class="result-title">可以这样对他说</div>
                                <div class="result-text" id="result-text"></div>
                                <div class="result-actions">
                                    <button class="btn secondary magnetic" id="regen-btn">换一种说法</button>
                                    <button class="btn magnetic" id="copy-btn">复制这句话</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <button class="btn secondary magnetic" onclick="goStart()" style="margin-top:18px;">回到小家</button>

                <p class="footer-text">好好说话，慢慢过日子 · AI 生成 · 内容仅供娱乐参考</p>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        /* ===== 工具 ===== */
        const $ = id => document.getElementById(id);
        const isFinePointer = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* ===== 余烬微光（暖灯氛围） ===== */
        (function(){
            const home=$('home');
            if(reduceMotion) return;
            for(let i=0;i<22;i++){
                const s=document.createElement('div');
                s.className='ember';
                s.style.width=(1.5+Math.random()*2.2)+'px';
                s.style.height=s.style.width;
                s.style.left=(Math.random()*100)+'%';
                s.style.top=(Math.random()*100)+'%';
                s.style.animationDelay=(Math.random()*4.6)+'s';
                s.style.animationDuration=(3.4+Math.random()*2.6).toFixed(2)+'s';
                home.appendChild(s);
            }
        })();

        /* ===== 1. 自定义光标（桌面） ===== */
        (function(){
            if(!isFinePointer || reduceMotion) return;
            document.body.classList.add('custom-cursor');
            const dot=$('cursor-dot'), ring=$('cursor-ring');
            let mx=innerWidth/2, my=innerHeight/2, rx=mx, ry=my;
            const lerp=(a,b,t)=>a+(b-a)*t;
            document.addEventListener('mousemove',e=>{
                mx=e.clientX; my=e.clientY;
                dot.style.left=mx+'px'; dot.style.top=my+'px';
            });
            (function loop(){
                rx=lerp(rx,mx,0.16); ry=lerp(ry,my,0.16);
                ring.style.left=rx+'px'; ring.style.top=ry+'px';
                requestAnimationFrame(loop);
            })();
            document.querySelectorAll('a,button,.tag,.card,.example-chip,.orb-btn').forEach(el=>{
                el.addEventListener('mouseenter',()=>ring.classList.add('grow'));
                el.addEventListener('mouseleave',()=>ring.classList.remove('grow'));
            });
            document.addEventListener('mouseleave',()=>ring.classList.add('hide'));
            document.addEventListener('mouseenter',()=>ring.classList.remove('hide'));
        })();

        /* ===== 2. 磁吸按钮（桌面） ===== */
        (function(){
            if(!isFinePointer || reduceMotion) return;
            document.querySelectorAll('.magnetic,.orb-btn').forEach(btn=>{
                btn.addEventListener('mousemove',e=>{
                    const r=btn.getBoundingClientRect();
                    const dx=e.clientX-(r.left+r.width/2);
                    const dy=e.clientY-(r.top+r.height/2);
                    btn.style.transform='translate('+dx*0.18+'px,'+dy*0.22+'px)';
                });
                btn.addEventListener('mouseleave',()=>{
                    btn.style.transition='transform 0.5s cubic-bezier(0.34,1.56,0.64,1)';
                    btn.style.transform='translate(0,0)';
                    setTimeout(()=>{ btn.style.transition=''; },500);
                });
            });
        })();

        /* ===== 3. 文字逐字入场 ===== */
        (function(){
            if(reduceMotion) return;
            const chars=document.querySelectorAll('.logo-line .char');
            chars.forEach((c,i)=>{
                c.style.animationDelay=(0.15+i*0.12)+'s';
                c.classList.add('up');
            });
        })();

        /* ===== 4. 无缝跑马灯 ===== */
        (function(){
            const track=$('marquee-track');
            const items=['好好说话','慢慢过日子','一人不为家','两人即为家','家的屋檐','两人共顶'];
            const half=items.map(t=>'<span class="marquee-item">'+t+'<span class="gold"> · </span></span>').join('');
            track.innerHTML=half+half;
        })();

        /* ===== 场景切换 ===== */
        let currentScene = 'peace';
        document.querySelectorAll('#scene-group .tag').forEach(tag=>{
            tag.addEventListener('click',()=>{
                document.querySelectorAll('#scene-group .tag').forEach(t=>t.classList.remove('selected'));
                tag.classList.add('selected');
                currentScene = tag.dataset.value;
            });
        });

        /* ===== 示例句 ===== */
        const examples = {
            peace: '你怎么又不回我消息，是不是根本不把我当回事',
            soft:  '这个周末我不想出门，但又怕你失望',
            warm:  '今天路过一家很好吃的店，第一个想到你',
            sorry: '昨晚是我说话太难听，对不起'
        };
        $('example-chip').addEventListener('click',()=>{
            $('input').value = examples[currentScene];
            $('input').focus();
            showToast('已填入示例，可改成你的话');
        });

        /* ===== 页面切换 ===== */
        function goChat(){
            $('page-start').classList.remove('active');
            $('page-chat').classList.add('active');
            window.scrollTo(0,0);
        }
        function goStart(){
            $('page-chat').classList.remove('active');
            $('page-start').classList.add('active');
            window.scrollTo(0,0);
        }

        function showToast(msg){
            const t=$('toast');
            t.textContent=msg; t.classList.add('show');
            clearTimeout(t._timer);
            t._timer=setTimeout(()=>t.classList.remove('show'),2200);
        }

        /* ===== 生成话术 ===== */
        async function generate(){
            const content=$('input').value.trim();
            if(!content){ showToast('先写下一句话呀'); return; }

            $('loading-mask').classList.add('show');
            $('result-box').classList.remove('show');
            $('generate-btn').disabled=true;
            $('generate-btn').textContent='正在润色…';

            try{
                const res=await fetch('/api/chat',{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({scene:currentScene,content:content})
                });
                if(!res.ok){ showToast('话术服务暂时不可用，稍后再试'); return; }
                const data=await res.json();
                if(data.result){
                    $('result-text').textContent=data.result;
                    $('result-box').classList.add('show');
                }else{
                    showToast(data.error||'生成失败，请稍后再试');
                }
            }catch(e){
                console.error(e);
                showToast('话术服务暂时不可用，稍后再试');
            }finally{
                $('loading-mask').classList.remove('show');
                $('generate-btn').disabled=false;
                $('generate-btn').textContent='把话说好';
            }
        }
        $('generate-btn').addEventListener('click',generate);
        $('regen-btn').addEventListener('click',generate);

        /* ===== 复制 ===== */
        $('copy-btn').addEventListener('click',()=>{
            const text=$('result-text').textContent;
            if(!text) return;
            if(navigator.clipboard&&navigator.clipboard.writeText){
                navigator.clipboard.writeText(text).then(()=>{
                    $('copy-btn').textContent='已复制';
                    setTimeout(()=>{$('copy-btn').textContent='复制这句话';},2000);
                });
            }else{
                const ta=document.createElement('textarea');
                ta.value=text; document.body.appendChild(ta);
                ta.select(); document.execCommand('copy');
                document.body.removeChild(ta);
                $('copy-btn').textContent='已复制';
                setTimeout(()=>{$('copy-btn').textContent='复制这句话';},2000);
            }
        });
    </script>
</body>
</html>
